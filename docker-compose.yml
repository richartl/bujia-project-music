services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      # node_modules en volumen aparte para no pisar con el bind mount
      # y no tener que reinstalar cada vez que se levanta el contenedor
      - node_modules:/app/node_modules
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
    # Sin Dockerfile ni build: instala si falta node_modules y levanta
    # el dev server de Astro directo con la imagen oficial de node.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4321"

volumes:
  node_modules:
